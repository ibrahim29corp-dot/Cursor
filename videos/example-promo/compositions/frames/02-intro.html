    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          document.getElementById("f02-intro-wordmark"),
          { scale: 0.6, opacity: 0, y: 12 },
          { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          0.05,
        );

        const ruleLine = document.getElementById("f02-intro-rule-line");
        const ruleLen = 1252;
        tl.fromTo(
          ruleLine,
          { strokeDasharray: ruleLen, strokeDashoffset: ruleLen },
          { strokeDasharray: ruleLen, strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
          0.4,
        );

        tl.fromTo(
          document.getElementById("f02-intro-kicker"),
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          0.75,
        );

        // Each step wrapper carries one spring; nesting composes their translates
        // additively, so no onUpdate callback is needed (seek suppresses callbacks).
        const ITEM_HEIGHT = 64;
        const STEP_TIMES = [0.8, 1.22, 1.64, 2.06, 2.48, 2.9];
        const STEP_DUR = 0.45;
        const FADE_DUR = 0.3;
        const steps = Array.from(document.querySelectorAll(".f02-intro-step"));
        const items = Array.from(document.querySelectorAll(".f02-intro-item"));

        steps.forEach((el, i) => {
          tl.fromTo(
            el,
            { y: 0 },
            { y: -ITEM_HEIGHT, duration: STEP_DUR, ease: "back.out(1.2)" },
            STEP_TIMES[i],
          );
        });

        items.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0 },
            { opacity: 1, duration: FADE_DUR, ease: "power1.out" },
            STEP_TIMES[i],
          );
          if (i + 1 < STEP_TIMES.length) {
            tl.fromTo(
              el,
              { opacity: 1 },
              { opacity: 0, duration: FADE_DUR, ease: "power1.in", immediateRender: false },
              STEP_TIMES[i + 1],
            );
          }
        });

        tl.fromTo(
          document.getElementById("f02-intro-item-en"),
          { color: "rgba(0, 0, 0, 0.6)" },
          { color: "rgba(0, 0, 0, 1)", duration: 0.3, ease: "power1.out" },
          2.95,
        );

        const codes = Array.from(document.querySelectorAll(".f02-intro-code"));
        const CODE_TIMES = [0, 1.22, 1.64, 2.06, 2.48, 2.9];
        codes.forEach((el, i) => tl.set(el, { opacity: i === 0 ? 1 : 0 }, 0));
        for (let i = 1; i < codes.length; i++) {
          tl.set(codes[i - 1], { opacity: 0 }, CODE_TIMES[i]);
          tl.set(codes[i], { opacity: 1 }, CODE_TIMES[i]);
        }

        Array.from(document.getElementById("f02-intro-follow").querySelectorAll('.f02-intro-word')).forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
            2.98 + i * 0.09,
          );
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["02-intro"] = tl;
      })();
